  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- SheetJS untuk Export & Import Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    /* =====================================================================
       DESIGN SYSTEM: LEAF GREEN GLASSMORPHISM (CLEAN CORPORATE + FRESH)
       ===================================================================== */
    :root {
      --leaf-50: #f0fdf4;
      --leaf-100: #dcfce7;
      --leaf-200: #bbf7d0;
      --leaf-300: #86efac;
      --leaf-400: #4ade80;
      --leaf-500: #22c55e;
      --leaf-600: #16a34a;
      --leaf-700: #15803d;
      --leaf-800: #166534;
      --leaf-900: #14532d;

      --bg-base: #f6fbf7;
      --surface-glass: rgba(255, 255, 255, 0.78);
      --surface-glass-strong: rgba(255, 255, 255, 0.92);
      --border-glass: rgba(22, 163, 74, 0.16);
      --border-subtle: rgba(15, 23, 42, 0.08);

      --text-main: #0f291a;
      --text-muted: #4b6857;
      --text-soft: #749080;

      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --warning: #d97706;
      --warning-bg: #fffbeb;

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --shadow-glass: 0 10px 30px -10px rgba(21, 128, 61, 0.12), 0 4px 12px -4px rgba(15, 41, 26, 0.05);
      --shadow-float: 0 18px 40px -12px rgba(21, 128, 61, 0.22);
      --sidebar-w: 268px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background: var(--bg-base);
      height: 100%;
      overflow: hidden;
    }

    /* Full Page Wrapper menutupi seluruh elemen bawaan Blogger tanpa edit XML */
    #sitabung-root {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background:
        radial-gradient(circle at 12% 10%, rgba(134, 239, 172, 0.35), transparent 36%),
        radial-gradient(circle at 88% 14%, rgba(74, 222, 128, 0.22), transparent 34%),
        radial-gradient(circle at 50% 95%, rgba(187, 247, 208, 0.42), transparent 40%),
        #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Scrollbar rapi */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(22, 163, 74, 0.25); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(22, 163, 74, 0.45); }

    /* =====================================================================
       PREVIEW BANNER (Hanya tampil jika IS_PREVIEW === true)
       ===================================================================== */
    .preview-banner {
      background: linear-gradient(90deg, #14532d, #15803d, #16a34a);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-shrink: 0;
      z-index: 50;
      letter-spacing: 0.2px;
    }
    .preview-pill {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    /* =====================================================================
       GLASS COMPONENTS & BUTTONS
       ===================================================================== */
    .glass-card {
      background: var(--surface-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-glass);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, var(--leaf-600), var(--leaf-700));
      color: #fff;
      box-shadow: 0 6px 16px -4px rgba(21, 128, 61, 0.42);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px -4px rgba(21, 128, 61, 0.5);
    }
    .btn-soft {
      background: var(--leaf-100);
      color: var(--leaf-800);
      border: 1px solid rgba(22, 163, 74, 0.18);
    }
    .btn-soft:hover:not(:disabled) { background: var(--leaf-200); }
    .btn-outline {
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-main);
      border: 1px solid var(--border-glass);
    }
    .btn-outline:hover:not(:disabled) {
      border-color: var(--leaf-500);
      color: var(--leaf-700);
      background: var(--leaf-50);
    }
    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(220, 38, 38, 0.2);
    }
    .btn-danger:hover:not(:disabled) { background: #fee2e2; }
    .btn-sm { padding: 7px 12px; font-size: 12.5px; border-radius: 8px; }
    .btn-icon { padding: 8px; width: 36px; height: 36px; }

    .input, .select {
      width: 100%;
      padding: 10px 13px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(22, 163, 74, 0.24);
      background: rgba(255, 255, 255, 0.92);
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input:focus, .select:focus {
      border-color: var(--leaf-600);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
    }
    .field-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    /* =====================================================================
       LOGIN VIEW
       ===================================================================== */
    #login-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }
    .login-box {
      width: 100%;
      max-width: 430px;
      padding: 34px 30px;
      position: relative;
      overflow: hidden;
    }
    .login-box::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--leaf-400), var(--leaf-600), var(--leaf-800));
    }
    .brand-badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--leaf-500), var(--leaf-700));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 12px 24px -6px rgba(22, 163, 74, 0.45);
      margin-bottom: 18px;
    }
    .login-title { font-size: 23px; font-weight: 800; letter-spacing: -0.4px; }
    .login-sub { font-size: 13.5px; color: var(--text-muted); margin-top: 5px; line-height: 1.5; }
    .form-group { margin-top: 16px; }
    .login-error {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--danger-bg);
      color: var(--danger);
      font-size: 12.5px;
      font-weight: 600;
      display: none;
    }

    /* =====================================================================
       MAIN APP SHELL (DESKTOP SIDEBAR + MOBILE BOTTOM NAV)
       ===================================================================== */
    #app-shell {
      flex: 1;
      display: none;
      min-height: 0;
      position: relative;
    }
    #app-shell.active { display: flex; }

    /* Desktop Fixed Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      z-index: 20;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 10px 20px;
      border-bottom: 1px solid var(--border-glass);
      margin-bottom: 16px;
    }
    .sidebar-logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--leaf-500), var(--leaf-700));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 8px 18px -4px rgba(22, 163, 74, 0.4);
    }
    .sidebar-brand h1 { font-size: 17px; font-weight: 800; line-height: 1.1; color: var(--leaf-900); }
    .sidebar-brand span { font-size: 11.5px; color: var(--text-muted); font-weight: 500; }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      overflow-y: auto;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      text-align: left;
      transition: all 0.2s;
      width: 100%;
    }
    .nav-item:hover {
      background: var(--leaf-50);
      color: var(--leaf-800);
    }
    .nav-item.active {
      background: linear-gradient(135deg, var(--leaf-600), var(--leaf-700));
      color: #ffffff;
      box-shadow: 0 8px 18px -6px rgba(21, 128, 61, 0.5);
    }

    .sidebar-footer {
      padding-top: 14px;
      border-top: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .admin-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 12px;
      background: var(--leaf-50);
      border: 1px solid var(--border-glass);
    }
    .admin-avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--leaf-700);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .admin-meta { min-width: 0; flex: 1; }
    .admin-meta div { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .admin-meta span { font-size: 11px; color: var(--text-muted); }

    /* Main Workspace */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    /* Top Bar with Global Year & Class Switcher */
    .topbar {
      padding: 14px 24px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
      z-index: 15;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .page-heading { font-size: 18px; font-weight: 800; color: var(--leaf-900); letter-spacing: -0.3px; }
    .switcher-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .switcher-select {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(22, 163, 74, 0.28);
      background: rgba(255, 255, 255, 0.92);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--leaf-900);
      cursor: pointer;
      outline: none;
    }
    .switcher-select:focus { border-color: var(--leaf-600); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* Scrollable Content */
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 22px 24px 36px;
    }

    /* Mobile Floating Bottom Navigation */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 40;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(22, 163, 74, 0.24);
      border-radius: 20px;
      box-shadow: var(--shadow-float);
      padding: 6px;
      justify-content: space-around;
      align-items: center;
    }
    .m-nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 7px 4px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .m-nav-btn.active {
      background: linear-gradient(135deg, var(--leaf-600), var(--leaf-700));
      color: #fff;
      box-shadow: 0 6px 14px -4px rgba(21, 128, 61, 0.45);
    }

    /* =====================================================================
       DASHBOARD, STATS, CHARTS, TABLES
       ===================================================================== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card {
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
    }
    .stat-card.featured {
      background: linear-gradient(135deg, var(--leaf-700), var(--leaf-600), #22c55e);
      color: #fff;
      border: none;
      box-shadow: 0 14px 28px -10px rgba(21, 128, 61, 0.5);
    }
    .stat-label { font-size: 12px; font-weight: 600; opacity: 0.85; display: flex; align-items: center; justify-content: space-between; }
    .stat-value { font-size: 23px; font-weight: 800; margin-top: 8px; letter-spacing: -0.5px; }
    .stat-sub { font-size: 11.5px; margin-top: 5px; opacity: 0.78; }

    .dash-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 18px;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .card-title { font-size: 15px; font-weight: 800; color: var(--leaf-900); }
    .card-body { padding: 18px 20px; }

    /* Bar Chart 12 Bulan */
    .chart-wrap {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
      height: 210px;
      padding-top: 22px;
    }
    .chart-col {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      cursor: pointer;
    }
    .chart-bar-track {
      width: 100%;
      max-width: 30px;
      flex: 1;
      background: var(--leaf-50);
      border-radius: 99px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      border: 1px solid rgba(22, 163, 74, 0.12);
    }
    .chart-bar-fill {
      width: 100%;
      background: linear-gradient(180deg, var(--leaf-400), var(--leaf-700));
      border-radius: 99px;
      transition: height 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      min-height: 0;
    }
    .chart-col:hover .chart-bar-fill { filter: brightness(1.08); }
    .chart-lbl { font-size: 11px; font-weight: 700; color: var(--text-muted); }
    .chart-val { font-size: 10px; font-weight: 700; color: var(--leaf-700); min-height: 14px; }

    /* Recent Transactions List */
    .tx-list { display: flex; flex-direction: column; gap: 10px; }
    .tx-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 13px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--border-glass);
      cursor: pointer;
      transition: all 0.18s;
    }
    .tx-row:hover {
      border-color: var(--leaf-500);
      background: var(--leaf-50);
      transform: translateX(2px);
    }
    .tx-left { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .tx-dot {
      width: 36px; height: 36px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; flex-shrink: 0;
    }
    .tx-dot.setor { background: var(--leaf-100); color: var(--leaf-700); }
    .tx-dot.tarik { background: var(--danger-bg); color: var(--danger); }
    .tx-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-meta { font-size: 11.5px; color: var(--text-muted); }
    .tx-amount { font-size: 13.5px; font-weight: 800; white-space: nowrap; }
    .tx-amount.setor { color: var(--leaf-700); }
    .tx-amount.tarik { color: var(--danger); }

    /* Tables & Excel-like Interactive Matrix */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid var(--border-glass);
      background: rgba(255, 255, 255, 0.9);
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    table.data-table th {
      background: var(--leaf-50);
      color: var(--leaf-900);
      font-weight: 700;
      text-align: left;
      padding: 11px 12px;
      border-bottom: 1px solid var(--border-glass);
      white-space: nowrap;
    }
    table.data-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(22, 163, 74, 0.09);
      vertical-align: middle;
    }
    table.data-table tr:last-child td { border-bottom: none; }
    table.data-table tbody tr:hover td { background: rgba(240, 253, 244, 0.65); }

    /* Matrix Table (Tanggal 1-31 & Tahunan) */
    table.matrix-table {
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
      width: max-content;
      min-width: 100%;
    }
    table.matrix-table th, table.matrix-table td {
      border-right: 1px solid rgba(22, 163, 74, 0.12);
      border-bottom: 1px solid rgba(22, 163, 74, 0.12);
      padding: 7px 8px;
      text-align: center;
      white-space: nowrap;
    }
    table.matrix-table thead th {
      background: var(--leaf-700);
      color: #fff;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 3;
    }
    table.matrix-table .sticky-no {
      position: sticky; left: 0; z-index: 2;
      background: #fff; width: 42px; min-width: 42px;
    }
    table.matrix-table .sticky-name {
      position: sticky; left: 42px; z-index: 2;
      background: #fff; text-align: left;
      min-width: 185px; max-width: 220px;
      font-weight: 700; color: var(--text-main);
      box-shadow: 3px 0 6px -3px rgba(15, 41, 26, 0.1);
    }
    table.matrix-table thead .sticky-no,
    table.matrix-table thead .sticky-name {
      background: var(--leaf-800);
      color: #fff;
      z-index: 5;
    }
    .matrix-cell {
      cursor: pointer;
      min-width: 58px;
      transition: background 0.14s, transform 0.1s;
    }
    .matrix-cell:hover {
      background: var(--leaf-100) !important;
      outline: 2px solid var(--leaf-500);
      outline-offset: -2px;
    }
    .matrix-cell.filled {
      background: rgba(220, 252, 231, 0.55);
      color: var(--leaf-800);
      font-weight: 700;
    }
    .matrix-cell.neg {
      background: rgba(254, 226, 226, 0.6);
      color: var(--danger);
      font-weight: 700;
    }
    .matrix-total-col {
      background: var(--leaf-50);
      font-weight: 800;
      color: var(--leaf-900);
      text-align: right !important;
      padding-right: 12px !important;
    }
    .matrix-foot td {
      background: var(--leaf-100) !important;
      font-weight: 800;
      color: var(--leaf-900);
    }

    .student-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 14px;
    }
    .student-card {
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .student-card:hover {
      transform: translateY(-2px);
      border-color: var(--leaf-500);
      box-shadow: var(--shadow-float);
    }
    .student-top { display: flex; align-items: center; gap: 12px; }
    .student-num {
      width: 36px; height: 36px; border-radius: 11px;
      background: var(--leaf-100); color: var(--leaf-800);
      font-weight: 800; font-size: 13px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .student-name { font-size: 14px; font-weight: 800; line-height: 1.3; }
    .student-saldo { font-size: 19px; font-weight: 800; color: var(--leaf-700); }

    /* Sub Tabs */
    .sub-tabs {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border-glass);
      border-radius: 13px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 18px;
      flex-wrap: wrap;

    .sub-tab {
      padding: 8px 15px;
      border-radius: 9px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.18s;

      background: var(--leaf-600);
      color: #fff;
      box-shadow: 0 4px 10px -2px rgba(22, 163, 74, 0.4);

      display: inline-flex; align-items: center; gap: 5px;

    .badge-red { background: var(--danger-bg); color: var(--danger); }

       ===================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000010;
      background: rgba(15, 41, 26, 0.42);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;

    .modal-box {
      width: 100%;

      max-height: 90vh;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.96);

      from { opacity: 0; transform: scale(0.95) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--leaf-50);
    }
    .modal-head h3 { font-size: 16px; font-weight: 800; color: var(--leaf-900); }
    .modal-body { padding: 18px 20px; overflow-y: auto; }
    .modal-foot {
      padding: 14px 20px;
      border-top: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      background: rgba(240, 253, 244, 0.5);
    }

    .toast-container {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 1000050;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      padding: 12px 16px;
      border-radius: 13px;
      background: var(--leaf-900);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 12px 28px -6px rgba(15, 41, 26, 0.35);
      display: flex;
      align-items: center;
      gap: 9px;
      animation: toastIn 0.22s ease;
    }
    .toast.error { background: #b91c1c; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Quick Nominal Chips */
    .nominal-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip-btn {
      padding: 5px 10px; border-radius: 99px;

      font-size: 11.5px; font-weight: 700; cursor: pointer;
    }

    @media (max-width: 1024px) {

    /* Print Styles */

        { id: 'sis-1', kelas_id: 'kls-1', no_urut: 1, nama_lengkap: 'ACHMAD ALBY ANANDIO', aktif: true },
        { id: 'sis-2', kelas_id: 'kls-1', no_urut: 2, nama_lengkap: 'ADINDA PUTRI AYUNITA', aktif: true }
      ],
      transaksi_tabungan: [
        { id: 'tx-1', siswa_id: 'sis-1', kelas_id: 'kls-1', tanggal: '2026-07-23', jenis: 'setor', nominal: 50000, keterangan: 'Setoran awal' },
        { id: 'tx-2', siswa_id: 'sis-2', kelas_id: 'kls-1', tanggal: '2026-07-27', jenis: 'setor', nominal: 20000, keterangan: 'Tabungan harian' }
      ]
    } : null;

    // =====================================================================
    // UTILITIES
    // =====================================================================
    const uid = () => 'id-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    const fmtRp = (n) => {
      const val = Number(n || 0);
      return (val < 0 ? '-Rp ' : 'Rp ') + Math.abs(val).toLocaleString('id-ID');
    };
    const fmtCompact = (n) => {
      const val = Number(n || 0);
      if (val === 0) return '';
      if (Math.abs(val) >= 1000) return (val / 1000).toLocaleString('id-ID') + 'k';
      return val.toLocaleString('id-ID');
    };
    const todayISO = () => {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };
    const escapeHtml = (str = '') => String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    const getActiveTp = () => state.tahunPelajaran.find(t => t.id === state.activeTpId) || null;
    const getActiveKelas = () => state.kelas.find(k => k.id === state.activeKelasId) || null;
    const getKelasByTp = (tpId) => state.kelas.filter(k => k.tahun_pelajaran_id === tpId);
    const getSiswaAktifKelas = () => state.siswa
      .filter(s => s.kelas_id === state.activeKelasId)
      .sort((a, b) => (a.no_urut || 999) - (b.no_urut || 999) || a.nama_lengkap.localeCompare(b.nama_lengkap));
    const getTxAktifKelas = () => state.transaksi.filter(t => t.kelas_id === state.activeKelasId);
    const signedNominal = (tx) => tx.jenis === 'tarik' ? -Math.abs(Number(tx.nominal || 0)) : Math.abs(Number(tx.nominal || 0));

    function showToast(message, isError = false) {
      const wrap = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = 'toast' + (isError ? ' error' : '');
      el.innerHTML = `<span>${isError ? '⚠️' : '✅'}</span><span>${escapeHtml(message)}</span>`;
      wrap.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s';
        setTimeout(() => el.remove(), 250);
      }, 2800);
    }

    function openModal({ title, bodyHtml, footHtml = '', wide = false }) {
      const backdrop = document.getElementById('app-modal');
      const box = document.getElementById('app-modal-box');
      box.className = 'modal-box' + (wide ? ' wide' : '');
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      document.getElementById('modal-foot').innerHTML = footHtml;
      backdrop.classList.add('open');
    }
    function closeModal() {
      document.getElementById('app-modal').classList.remove('open');
    }

    function openConfirmModal(title, message, onConfirm, confirmLabel = 'Ya, Hapus') {
      openModal({
        title,
        bodyHtml: `<p style="font-size:14px; color:var(--text-muted); line-height:1.6;">${escapeHtml(message)}</p>`,
        footHtml: `
          <button type="button" class="btn btn-outline" id="cfm-cancel">Batal</button>
          <button type="button" class="btn btn-danger" id="cfm-ok">${escapeHtml(confirmLabel)}</button>
        `
      });
      document.getElementById('cfm-cancel').onclick = closeModal;
      document.getElementById('cfm-ok').onclick = async () => {
        const btn = document.getElementById('cfm-ok');
        btn.disabled = true;
        btn.textContent = 'Memproses...';
        try {
          await onConfirm();
          closeModal();
        } catch (err) {
          showToast(err.message || 'Terjadi kesalahan', true);
          btn.disabled = false;
          btn.textContent = confirmLabel;
        }
      };
    }

    // =====================================================================
    // DATA LAYER (PREVIEW LOCAL vs SUPABASE REAL-TIME)
    // =====================================================================
    async function loadAllData() {
      try {
        if (IS_PREVIEW) {
          state.tahunPelajaran = [...previewStore.tahun_pelajaran];
          state.kelas = [...previewStore.kelas];
          state.siswa = [...previewStore.siswa];
          state.transaksi = [...previewStore.transaksi_tabungan];
        } else {
          const [tpRes, klsRes, sisRes, txRes] = await Promise.all([
            supabase.from('tahun_pelajaran').select('*').order('tahun_mulai', { ascending: false }),
            supabase.from('kelas').select('*').order('nama_kelas', { ascending: true }),
            supabase.from('siswa').select('*').order('no_urut', { ascending: true }),
            supabase.from('transaksi_tabungan').select('*').order('tanggal', { ascending: false })
          ]);
          if (tpRes.error) throw tpRes.error;
          if (klsRes.error) throw klsRes.error;
          if (sisRes.error) throw sisRes.error;
          if (txRes.error) throw txRes.error;
          state.tahunPelajaran = tpRes.data || [];
          state.kelas = klsRes.data || [];
          state.siswa = sisRes.data || [];
          state.transaksi = txRes.data || [];
        }

        // Pastikan activeTpId & activeKelasId valid
        if (!state.activeTpId || !state.tahunPelajaran.some(t => t.id === state.activeTpId)) {
          const aktif = state.tahunPelajaran.find(t => t.is_aktif) || state.tahunPelajaran[0];
          state.activeTpId = aktif ? aktif.id : null;
        }
        const kelasDiTp = getKelasByTp(state.activeTpId);
        if (!state.activeKelasId || !kelasDiTp.some(k => k.id === state.activeKelasId)) {
          state.activeKelasId = kelasDiTp[0] ? kelasDiTp[0].id : null;
        }

        renderSwitchers();
        renderCurrentView();
      } catch (err) {
        console.error(err);
        showToast('Gagal memuat data: ' + (err.message || err), true);
      }
    }

    async function dbInsert(table, payload) {
      if (IS_PREVIEW) {
        const rows = Array.isArray(payload) ? payload : [payload];
        const inserted = rows.map(r => ({ id: uid(), created_at: new Date().toISOString(), ...r }));
        previewStore[table].push(...inserted);
        return inserted;
      }
      const { data, error } = await supabase.from(table).insert(payload).select();
      if (error) throw error;
      return data;
    }

    async function dbUpdate(table, id, payload) {
      if (IS_PREVIEW) {
        const idx = previewStore[table].findIndex(r => r.id === id);
        if (idx >= 0) previewStore[table][idx] = { ...previewStore[table][idx], ...payload };
        return previewStore[table][idx];
      }
      const { data, error } = await supabase.from(table).update(payload).eq('id', id).select().single();
      if (error) throw error;
      return data;
    }

    async function dbDelete(table, id) {
      if (IS_PREVIEW) {
        previewStore[table] = previewStore[table].filter(r => r.id !== id);
        if (table === 'tahun_pelajaran') {
          const klsIds = previewStore.kelas.filter(k => k.tahun_pelajaran_id === id).map(k => k.id);
          previewStore.kelas = previewStore.kelas.filter(k => k.tahun_pelajaran_id !== id);
          previewStore.siswa = previewStore.siswa.filter(s => !klsIds.includes(s.kelas_id));
          previewStore.transaksi_tabungan = previewStore.transaksi_tabungan.filter(t => !klsIds.includes(t.kelas_id));
        } else if (table === 'kelas') {
          previewStore.siswa = previewStore.siswa.filter(s => s.kelas_id !== id);
          previewStore.transaksi_tabungan = previewStore.transaksi_tabungan.filter(t => t.kelas_id !== id);
        } else if (table === 'siswa') {
          previewStore.transaksi_tabungan = previewStore.transaksi_tabungan.filter(t => t.siswa_id !== id);
        }
        return;
      }
      const { error } = await supabase.from(table).delete().eq('id', id);
      if (error) throw error;
    }

    // =====================================================================
    // SWITCHER & NAVIGATION
    // =====================================================================
    function renderSwitchers() {
      const tpSel = document.getElementById('global-tp-select');
      const klsSel = document.getElementById('global-kelas-select');

      if (!state.tahunPelajaran.length) {
        tpSel.innerHTML = `<option value="">Belum ada TP</option>`;
      } else {
        tpSel.innerHTML = state.tahunPelajaran.map(t =>
          `<option value="${t.id}" ${t.id === state.activeTpId ? 'selected' : ''}>TP ${escapeHtml(t.nama)}${t.is_aktif ? ' ★' : ''}</option>`
        ).join('');
      }

      const listKls = getKelasByTp(state.activeTpId);
      if (!listKls.length) {
        klsSel.innerHTML = `<option value="">Belum ada Kelas</option>`;
      } else {
        klsSel.innerHTML = listKls.map(k =>
          `<option value="${k.id}" ${k.id === state.activeKelasId ? 'selected' : ''}>${escapeHtml(k.nama_kelas)}</option>`
        ).join('');
      }

      const kls = getActiveKelas();
      document.getElementById('sidebar-school-sub').textContent = kls?.nama_sekolah || 'Tabungan Kelas Digital';
    }

    function setView(viewName) {
      state.view = viewName;
      if (viewName !== 'peranak') state.selectedStudentId = null;

      document.querySelectorAll('#desktop-nav .nav-item, #mobile-nav .m-nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === viewName);
      });

      const titles = {
        dashboard: 'Dashboard',
        peranak: 'Rekap Per Anak',
        bulanan: 'Rekap Bulanan (1–31)',
        tahunan: 'Rekap Tahunan (Jul–Jun)',
        kelola: 'Kelola Data & HP'
      };
      document.getElementById('page-heading').textContent = titles[viewName] || 'Dashboard';
      renderCurrentView();
    }

    function renderCurrentView() {
      const container = document.getElementById('main-content');
      if (state.view === 'dashboard') renderDashboard(container);
      else if (state.view === 'peranak') renderPerAnak(container);
      else if (state.view === 'bulanan') renderBulanan(container);
      else if (state.view === 'tahunan') renderTahunan(container);
      else if (state.view === 'kelola') renderKelola(container);
    }

    // =====================================================================
    // 1. VIEW: DASHBOARD
    // =====================================================================
    function renderDashboard(container) {
      const tp = getActiveTp();
      const kls = getActiveKelas();
      if (!tp || !kls) {
        container.innerHTML = `
          <div class="glass-card empty-state">
            <div style="font-size:38px;">🌱</div>
            <h3>Belum Ada Tahun Pelajaran / Kelas</h3>
            <p>Mulai dengan menambahkan Tahun Pelajaran dan Kelas pertama Anda di menu Kelola Data.</p>
            <button class="btn btn-primary" id="go-kelola-btn">Buka Kelola Data</button>
          </div>`;
        document.getElementById('go-kelola-btn').onclick = () => setView('kelola');
        return;
      }

      const siswaList = getSiswaAktifKelas();
      const txList = getTxAktifKelas();
      const totalSaldo = txList.reduce((acc, t) => acc + signedNominal(t), 0);

      const now = new Date();
      const curYM = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      const today = todayISO();
      const bulanIni = txList.filter(t => (t.tanggal || '').startsWith(curYM)).reduce((a, t) => a + signedNominal(t), 0);
      const hariIni = txList.filter(t => t.tanggal === today).reduce((a, t) => a + signedNominal(t), 0);

      // Hitung per bulan (Juli s.d. Juni) sesuai tahun_mulai TP
      const monthlyTotals = BULAN_TP.map(b => {
        const y = Number(tp.tahun_mulai) + b.offsetYear;
        const ym = `${y}-${String(b.month).padStart(2, '0')}`;
        const sum = txList.filter(t => (t.tanggal || '').startsWith(ym)).reduce((a, t) => a + signedNominal(t), 0);
        return { ...b, year: y, sum };
      });
      const maxBar = Math.max(1, ...monthlyTotals.map(m => Math.max(0, m.sum)));

      // 8 transaksi terbaru
      const recentTx = [...txList].sort((a, b) => (b.tanggal || '').localeCompare(a.tanggal || '')).slice(0, 8);
      const siswaMap = Object.fromEntries(siswaList.map(s => [s.id, s]));

      container.innerHTML = `
        <div class="stats-grid">
          <div class="glass-card stat-card featured">
            <div class="stat-label"><span>Total Saldo Kelas</span><span>💰</span></div>
            <div class="stat-value">${fmtRp(totalSaldo)}</div>

          </div>
          <div class="glass-card stat-card">
            <div class="stat-label"><span>Bulan Berjalan</span><span>📅</span></div>
            <div class="stat-value" style="color:var(--leaf-700);">${fmtRp(bulanIni)}</div>
            <div class="stat-sub">Periode ${curYM}</div>
          </div>
          <div class="glass-card stat-card">
            <div class="stat-label"><span>Hari Ini</span><span>✨</span></div>
            <div class="stat-value" style="color:var(--leaf-700);">${fmtRp(hariIni)}</div>
            <div class="stat-sub">Tanggal ${today}</div>
          </div>
          <div class="glass-card stat-card">
            <div class="stat-label"><span>Siswa Aktif</span><span>🎓</span></div>
            <div class="stat-value">${siswaList.length} <span style="font-size:14px; font-weight:600; color:var(--text-muted);">Anak</span></div>
            <div class="stat-sub">${escapeHtml(kls.wali_kelas || 'Wali Kelas belum diisi')}</div>
          </div>
        </div>

        <div class="dash-grid">
          <div class="glass-card">
            <div class="card-header">
              <div>
                <div class="card-title">Grafik Tabungan TP ${escapeHtml(tp.nama)}</div>
                <div style="font-size:12px; color:var(--text-muted);">Klik batang bulan untuk membuka Rekap Bulanan</div>
              </div>
            </div>
            <div class="card-body">
              <div class="chart-wrap">
                ${monthlyTotals.map(m => {
                  const pct = m.sum > 0 ? Math.max(8, Math.round((m.sum / maxBar) * 100)) : 0;
                  return `
                    <div class="chart-col" data-month-idx="${m.idx}" title="${m.name} ${m.year}: ${fmtRp(m.sum)}">
                      <div class="chart-val">${fmtCompact(m.sum)}</div>
                      <div class="chart-bar-track">
                        <div class="chart-bar-fill" style="height:${pct}%;"></div>
                      </div>

          <div class="student-grid">
            ${filtered.map(s => {
              const txs = txList.filter(t => t.siswa_id === s.id);

                <div class="glass-card student-card" data-open-student="${s.id}">
                  <div class="student-top">

                      <div class="student-saldo">${fmtRp(saldo)}</div>

    // =====================================================================
    // 3. VIEW: REKAP BULANAN (MATRIKS TANGGAL 1-31 INTERAKTIF)
    // =====================================================================
    function renderBulanan(container) {
      const tp = getActiveTp();
      const kls = getActiveKelas();
      if (!tp || !kls) {
        container.innerHTML = `<div class="glass-card empty-state"><h3>Belum Ada Kelas Terpilih</h3></div>`;
        return;
      }

      const bObj = BULAN_TP[state.selectedMonthIdx] || BULAN_TP[0];
      const year = Number(tp.tahun_mulai) + bObj.offsetYear;
      const monthStr = String(bObj.month).padStart(2, '0');
      const ymPrefix = `${year}-${monthStr}`;
      const daysInMonth = new Date(year, bObj.month, 0).getDate();

      const siswaList = getSiswaAktifKelas();
      const txBulan = getTxAktifKelas().filter(t => (t.tanggal || '').startsWith(ymPrefix));

      // Peta: cellMap[siswa_id][day] = { sum, list }
      const cellMap = {};
      const dayTotals = Array(daysInMonth + 1).fill(0);
      let grandTotal = 0;

      txBulan.forEach(tx => {
        const d = Number((tx.tanggal || '').slice(8, 10));
        if (!d || d < 1 || d > daysInMonth) return;
        if (!cellMap[tx.siswa_id]) cellMap[tx.siswa_id] = {};
        if (!cellMap[tx.siswa_id][d]) cellMap[tx.siswa_id][d] = { sum: 0, list: [] };
        const val = signedNominal(tx);
        cellMap[tx.siswa_id][d].sum += val;
        cellMap[tx.siswa_id][d].list.push(tx);
        dayTotals[d] += val;
        grandTotal += val;
      });

      container.innerHTML = `
        <div class="glass-card no-print" style="padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <label style="font-size:13px; font-weight:700; color:var(--leaf-900);">Pilih Bulan:</label>
            <select id="bulanan-month-select" class="switcher-select">
              ${BULAN_TP.map(b => {
                const y = Number(tp.tahun_mulai) + b.offsetYear;
                return `<option value="${b.idx}" ${b.idx === state.selectedMonthIdx ? 'selected' : ''}>${b.name} ${y}</option>`;
              }).join('')}
            </select>
            <span class="badge badge-green">💡 Klik sel tanggal mana pun untuk isi / edit langsung</span>
          </div>
          <div style="display:flex; gap:8px;">
            <button id="btn-export-bulanan" class="btn btn-soft btn-sm">📥 Export Excel</button>
            <button id="btn-print-bulanan" class="btn btn-outline btn-sm">🖨️ Cetak / PDF</button>
          </div>
        </div>

        <div class="glass-card" style="padding:16px;">
          <div style="margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
            <div>
              <h3 style="font-size:15px; font-weight:800; color:var(--leaf-900);">REKAP BULAN ${bObj.name.toUpperCase()} ${year}</h3>
              <div style="font-size:12px; color:var(--text-muted);">${escapeHtml(kls.nama_kelas)} • ${escapeHtml(kls.nama_sekolah || '')}</div>
            </div>
            <div style="font-size:15px; font-weight:800; color:var(--leaf-700);">Total Bulan: ${fmtRp(grandTotal)}</div>
          </div>

          ${siswaList.length === 0 ? `
            <div class="empty-state"><h3>Belum Ada Siswa di Kelas Ini</h3></div>
          ` : `
            <div class="table-wrap">
              <table class="matrix-table">
                <thead>
                  <tr>
                    <th class="sticky-no">NO</th>
                    <th class="sticky-name">NAMA SISWA</th>
                    ${Array.from({ length: daysInMonth }, (_, i) => `<th>${i + 1}</th>`).join('')}
                    <th>JUMLAH</th>
                  </tr>
                </thead>
                <tbody>
                  ${siswaList.map((s, idx) => {
                    let rowSum = 0;
                    const cells = Array.from({ length: daysInMonth }, (_, i) => {
                      const day = i + 1;
                      const info = cellMap[s.id]?.[day];
                      const val = info ? info.sum : 0;
                      rowSum += val;
                      const cls = val > 0 ? 'filled' : (val < 0 ? 'neg' : '');
                      return `<td class="matrix-cell ${cls}" data-cell-sis="${s.id}" data-cell-day="${day}" title="Klik untuk edit (${s.nama_lengkap}, ${day} ${bObj.name} ${year})">${val !== 0 ? val.toLocaleString('id-ID') : ''}</td>`;
                    }).join('');
                    return `
                      <tr>
                        <td class="sticky-no">${s.no_urut || idx + 1}</td>
                        <td class="sticky-name">${escapeHtml(s.nama_lengkap)}</td>
                        ${cells}
                        <td class="matrix-total-col">${fmtRp(rowSum)}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
                <tfoot>
                  <tr class="matrix-foot">
                    <td class="sticky-no"></td>
                    <td class="sticky-name" style="background:var(--leaf-100);">TOTAL HARIAN</td>
                    ${Array.from({ length: daysInMonth }, (_, i) => `<td>${dayTotals[i + 1] ? dayTotals[i + 1].toLocaleString('id-ID') : ''}</td>`).join('')}
                    <td class="matrix-total-col">${fmtRp(grandTotal)}</td>
                  </tr>
                </tfoot>
              </table>
            </div>
          `}
        </div>
      `;

      document.getElementById('bulanan-month-select').onchange = (e) => {
        state.selectedMonthIdx = Number(e.target.value);
        renderBulanan(container);
      };
      document.getElementById('btn-print-bulanan').onclick = () => window.print();
      document.getElementById('btn-export-bulanan').onclick = () => {
        exportBulananExcel(kls, tp, bObj, year, daysInMonth, siswaList, cellMap);
      };

      // Klik sel matriks -> langsung buka modal edit/tambah untuk siswa & tanggal tersebut
      container.querySelectorAll('.matrix-cell').forEach(td => {
        td.onclick = () => {
          const sisId = td.dataset.cellSis;
          const day = String(td.dataset.cellDay).padStart(2, '0');
          const isoDate = `${year}-${monthStr}-${day}`;
          const existing = cellMap[sisId]?.[Number(td.dataset.cellDay)]?.list || [];
          if (existing.length === 1) {
            openTxModal({ tx: existing[0] });
          } else if (existing.length > 1) {
            openDayMultiTxModal(sisId, isoDate, existing);
          } else {
            openTxModal({ defaultSiswaId: sisId, defaultDate: isoDate });
          }
        };
      });
    }

    // =====================================================================
    // 4. VIEW: REKAP TAHUNAN (JULI - JUNI INTERAKTIF)
    // =====================================================================
    function renderTahunan(container) {
      const tp = getActiveTp();
      const kls = getActiveKelas();
      if (!tp || !kls) {
        container.innerHTML = `<div class="glass-card empty-state"><h3>Belum Ada Kelas Terpilih</h3></div>`;
        return;
      }

      const siswaList = getSiswaAktifKelas();
      const txList = getTxAktifKelas();
      const monthTotals = Array(12).fill(0);
      let grandTotal = 0;

      // matrix[siswa_id][monthIdx] = sum
      const matrix = {};
      siswaList.forEach(s => { matrix[s.id] = Array(12).fill(0); });

      txList.forEach(tx => {
        const ym = (tx.tanggal || '').slice(0, 7);
        const mIdx = BULAN_TP.findIndex(b => {
          const y = Number(tp.tahun_mulai) + b.offsetYear;
          return `${y}-${String(b.month).padStart(2, '0')}` === ym;
        });
        if (mIdx >= 0 && matrix[tx.siswa_id]) {
          const val = signedNominal(tx);
          matrix[tx.siswa_id][mIdx] += val;
          monthTotals[mIdx] += val;
          grandTotal += val;
        }
      });

      container.innerHTML = `
        <div class="glass-card no-print" style="padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
          <span class="badge badge-green">💡 Klik nominal di bulan mana pun untuk melihat &amp; mengedit transaksi bulan tersebut</span>
          <div style="display:flex; gap:8px;">
            <button id="btn-export-tahunan" class="btn btn-soft btn-sm">📥 Export Excel Tahunan</button>
            <button id="btn-print-tahunan" class="btn btn-outline btn-sm">🖨️ Cetak / PDF</button>
          </div>
        </div>

        <div class="glass-card" style="padding:16px;">
          <div style="margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
            <div>
              <h3 style="font-size:15px; font-weight:800; color:var(--leaf-900);">REKAP TAHUNAN TP ${escapeHtml(tp.nama)} (JULI ${tp.tahun_mulai} – JUNI ${Number(tp.tahun_mulai) + 1})</h3>
              <div style="font-size:12px; color:var(--text-muted);">${escapeHtml(kls.nama_kelas)} • ${escapeHtml(kls.nama_sekolah || '')}</div>
            </div>
            <div style="font-size:16px; font-weight:800; color:var(--leaf-700);">Grand Total: ${fmtRp(grandTotal)}</div>
          </div>

          ${siswaList.length === 0 ? `
            <div class="empty-state"><h3>Belum Ada Siswa di Kelas Ini</h3></div>
          ` : `
            <div class="table-wrap">
              <table class="matrix-table">
                <thead>
                  <tr>
                    <th class="sticky-no">NO</th>
                    <th class="sticky-name">NAMA SISWA</th>
                    ${BULAN_TP.map(b => `<th>${b.short}</th>`).join('')}
                    <th>TOTAL TAHUNAN</th>
                  </tr>
                </thead>
                <tbody>
                  ${siswaList.map((s, idx) => {
                    const rowSum = matrix[s.id].reduce((a, b) => a + b, 0);
                    return `
                      <tr>
                        <td class="sticky-no">${s.no_urut || idx + 1}</td>
                        <td class="sticky-name">${escapeHtml(s.nama_lengkap)}</td>
                        ${matrix[s.id].map((val, mIdx) => {
                          const cls = val > 0 ? 'filled' : (val < 0 ? 'neg' : '');
                          return `<td class="matrix-cell ${cls}" data-yr-sis="${s.id}" data-yr-midx="${mIdx}">${val !== 0 ? val.toLocaleString('id-ID') : ''}</td>`;
                        }).join('')}
                        <td class="matrix-total-col">${fmtRp(rowSum)}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
                <tfoot>
                  <tr class="matrix-foot">
                    <td class="sticky-no"></td>
                    <td class="sticky-name" style="background:var(--leaf-100);">TOTAL KELAS</td>
                    ${monthTotals.map(v => `<td>${v ? v.toLocaleString('id-ID') : '0'}</td>`).join('')}
                    <td class="matrix-total-col">${fmtRp(grandTotal)}</td>
                  </tr>
                </tfoot>
              </table>
            </div>
          `}
        </div>
      `;

      document.getElementById('btn-print-tahunan').onclick = () => window.print();
      document.getElementById('btn-export-tahunan').onclick = () => exportTahunanExcel(kls, tp, siswaList, matrix);

      container.querySelectorAll('[data-yr-sis]').forEach(td => {
        td.onclick = () => {
          openMonthStudentTxModal(td.dataset.yrSis, Number(td.dataset.yrMidx));
        };
      });
    }

              for (const t of state.tahunPelajaran) {

              ${deferredPrompt ? '📲 Install Aplikasi Sekarang' : '📲 Panduan / Install via Browser'}

          </div>
        `;
        const installBtn = document.getElementById('btn-install-pwa-main');
        if (installBtn) {
          installBtn.onclick = () => {
            if (deferredPrompt) {
              triggerInstallPWA();

              showToast('Klik ikon Install di address bar Chrome atau menu browser (⋮ / Share) → Tambah ke Layar Utama.');
            }
          };

    async function triggerInstallPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') showToast('Aplikasi sedang dipasang ke perangkat Anda!');
      deferredPrompt = null;
      const btnSide = document.getElementById('btn-install-sidebar');
      if (btnSide) btnSide.style.display = 'none';
      if (state.view === 'kelola') renderCurrentView();
    }

    // =====================================================================
    // MODALS: TRANSAKSI SATUAN, MASSAL HARIAN, MULTI-TX, SISWA, KELAS, TP
    // =====================================================================
    function openTxModal({ tx = null, defaultSiswaId = null, defaultDate = null } = {}) {
      const siswaList = getSiswaAktifKelas();
      if (!siswaList.length) {
        showToast('Tambahkan siswa terlebih dahulu di menu Kelola Data', true);
        return;
      }

      const isEdit = !!tx;
      const selSisId = tx ? tx.siswa_id : (defaultSiswaId || siswaList[0].id);
      const selDate = tx ? tx.tanggal : (defaultDate || todayISO());
      const selJenis = tx ? tx.jenis : 'setor';
      const selNominal = tx ? tx.nominal : '';
      const selKet = tx ? (tx.keterangan || '') : '';

      openModal({
        title: isEdit ? 'Edit Catatan Tabungan' : 'Catat Tabungan Baru',
        bodyHtml: `
          <form id="tx-form">
            <div class="form-group" style="margin-top:0;">
              <label class="field-label">Nama Siswa</label>
              <select id="tx-siswa" class="select" required>
                ${siswaList.map(s => `<option value="${s.id}" ${s.id === selSisId ? 'selected' : ''}>${s.no_urut ? s.no_urut + '. ' : ''}${escapeHtml(s.nama_lengkap)}</option>`).join('')}
              </select>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;" class="form-group">
              <div>
                <label class="field-label">Tanggal</label>
                <input id="tx-tanggal" type="date" class="input" value="${selDate}" required />
              </div>
              <div>
                <label class="field-label">Jenis Transaksi</label>
                <select id="tx-jenis" class="select">
                  <option value="setor" ${selJenis === 'setor' ? 'selected' : ''}>Setoran (+)</option>
                  <option value="tarik" ${selJenis === 'tarik' ? 'selected' : ''}>Penarikan (−)</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label class="field-label">Nominal (Rp)</label>
              <input id="tx-nominal" type="number" min="500" step="500" class="input" placeholder="Contoh: 10000" value="${selNominal}" required />
              <div class="nominal-chips">
                ${[2000, 5000, 10000, 20000, 50000, 100000].map(n => `<button type="button" class="chip-btn" data-chip="${n}">${(n/1000)}rb</button>`).join('')}
              </div>
            </div>
            <div class="form-group">
              <label class="field-label">Keterangan (Opsional)</label>
              <input id="tx-ket" type="text" class="input" placeholder="Misal: Tabungan rutin" value="${escapeHtml(selKet)}" />
            </div>
          </form>
        `,
        footHtml: `
          ${isEdit ? `<button type="button" class="btn btn-danger" id="tx-del-btn" style="margin-right:auto;">Hapus</button>` : ''}
          <button type="button" class="btn btn-outline" id="tx-cancel-btn">Batal</button>
          <button type="button" class="btn btn-primary" id="tx-save-btn">${isEdit ? 'Simpan Perubahan' : 'Simpan Tabungan'}</button>
        `
      });

      document.querySelectorAll('[data-chip]').forEach(btn => {
        btn.onclick = () => { document.getElementById('tx-nominal').value = btn.dataset.chip; };
      });
      document.getElementById('tx-cancel-btn').onclick = closeModal;
      if (isEdit) {
        document.getElementById('tx-del-btn').onclick = () => confirmDeleteTx(tx.id);
      }
      document.getElementById('tx-save-btn').onclick = async () => {
        const siswa_id = document.getElementById('tx-siswa').value;
        const tanggal = document.getElementById('tx-tanggal').value;
        const jenis = document.getElementById('tx-jenis').value;
        const nominal = Number(document.getElementById('tx-nominal').value);
        const keterangan = document.getElementById('tx-ket').value.trim();

        if (!siswa_id || !tanggal || !nominal || nominal <= 0) {
          showToast('Lengkapi siswa, tanggal, dan nominal dengan benar', true);
          return;
        }
        const btn = document.getElementById('tx-save-btn');
        btn.disabled = true;
        btn.textContent = 'Menyimpan...';
        try {
          if (isEdit) {
            await dbUpdate('transaksi_tabungan', tx.id, { siswa_id, tanggal, jenis, nominal, keterangan, updated_at: new Date().toISOString() });
            showToast('Transaksi berhasil diperbarui');
          } else {
            await dbInsert('transaksi_tabungan', { siswa_id, kelas_id: state.activeKelasId, tanggal, jenis, nominal, keterangan });
            showToast('Tabungan berhasil dicatat');
          }
          closeModal();
          await loadAllData();
        } catch (err) {
          showToast(err.message || 'Gagal menyimpan transaksi', true);
          btn.disabled = false;
          btn.textContent = isEdit ? 'Simpan Perubahan' : 'Simpan Tabungan';
        }
      };
    }

    function openMassalModal() {
      const siswaList = getSiswaAktifKelas();
      if (!siswaList.length) {
        showToast('Tambahkan siswa terlebih dahulu di menu Kelola Data', true);
        return;
      }

      openModal({
        title: 'Catat Tabungan Massal Harian',
        wide: true,
        bodyHtml: `
          <div style="display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap;">
            <div style="flex:1; min-width:160px;">
              <label class="field-label">Tanggal Setoran</label>
              <input id="massal-date" type="date" class="input" value="${todayISO()}" />
            </div>
            <div style="flex:1; min-width:160px;">
              <label class="field-label">Keterangan Default</label>
              <input id="massal-ket" type="text" class="input" placeholder="Misal: Tabungan harian" />
            </div>
          </div>
          <p style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">Isi nominal hanya pada siswa yang menabung hari ini (biarkan kosong jika tidak menabung):</p>
          <div class="table-wrap" style="max-height:46vh; overflow-y:auto;">
            <table class="data-table">
              <thead><tr><th style="width:45px;">No</th><th>Nama Siswa</th><th style="width:180px;">Nominal (Rp)</th></tr></thead>
              <tbody>
                ${siswaList.map((s, i) => `
                  <tr>
                    <td>${s.no_urut || i + 1}</td>
                    <td style="font-weight:700;">${escapeHtml(s.nama_lengkap)}</td>
                    <td><input type="number" min="0" step="500" class="input massal-input" data-sis-id="${s.id}" placeholder="0" style="padding:7px 10px;" /></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `,
        footHtml: `
          <button type="button" class="btn btn-outline" id="massal-cancel">Batal</button>
          <button type="button" class="btn btn-primary" id="massal-save">Simpan Semua Setoran</button>
        `
      });

      document.getElementById('massal-cancel').onclick = closeModal;
      document.getElementById('massal-save').onclick = async () => {
        const tanggal = document.getElementById('massal-date').value;
        const keterangan = document.getElementById('massal-ket').value.trim();
        const rows = [];
        document.querySelectorAll('.massal-input').forEach(inp => {
          const val = Number(inp.value);
          if (val > 0) {
            rows.push({
              siswa_id: inp.dataset.sisId,
              kelas_id: state.activeKelasId,
              tanggal,
              jenis: 'setor',
              nominal: val,
              keterangan
            });
          }
        });
        if (!rows.length) {
          showToast('Isi minimal satu nominal siswa terlebih dahulu', true);
          return;
        }
        const btn = document.getElementById('massal-save');
        btn.disabled = true;
        btn.textContent = 'Menyimpan...';
        try {
          await dbInsert('transaksi_tabungan', rows);
          showToast(`${rows.length} setoran berhasil dicatat sekaligus!`);
          closeModal();
          await loadAllData();
        } catch (err) {
          showToast(err.message || 'Gagal menyimpan', true);
          btn.disabled = false;
          btn.textContent = 'Simpan Semua Setoran';
        }
      };
    }

    function openDayMultiTxModal(sisId, isoDate, txList) {

        title: `Transaksi ${sis?.nama_lengkap || ''} (${isoDate})`,
        bodyHtml: `
          <div class="tx-list">
            ${txList.map(tx => `
              <div class="tx-row" data-pick-tx="${tx.id}">
                <div>
                  <div class="tx-name">${tx.jenis === 'tarik' ? 'Penarikan' : 'Setoran'} • ${fmtRp(tx.nominal)}</div>
                  <div class="tx-meta">${escapeHtml(tx.keterangan || 'Tanpa keterangan')}</div>
                </div>
                <span class="badge badge-green">Edit</span>
              </div>
            `).join('')}
          </div>
        `,
        footHtml: `
          <button type="button" class="btn btn-outline" id="multi-close">Tutup</button>
          <button type="button" class="btn btn-primary" id="multi-add">+ Tambah Lagi di Tanggal Ini</button>
        `
      });
      document.getElementById('multi-close').onclick = closeModal;
      document.getElementById('multi-add').onclick = () => openTxModal({ defaultSiswaId: sisId, defaultDate: isoDate });

    function parseNominalCell(raw) {
      if (raw === null || raw === undefined || raw === '') return 0;
      if (typeof raw === 'number') return Math.round(raw);
      const cleaned = String(raw).replace(/rp/gi, '').replace(/\./g, '').replace(/,/g, '').trim();
      const num = Number(cleaned);
      return isNaN(num) ? 0 : Math.round(num);
    }

    async function handleParseExcelTabungan(e, tp, siswaList, container) {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file || typeof XLSX === 'undefined') return;

      try {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

        const existingMap = new Map(siswaList.map(s => [s.nama_lengkap.trim().toUpperCase(), s]));
        const autoAdd = document.getElementById('imp-auto-add-siswa')?.checked ?? true;
        const entries = [];
        const newStudentMap = new Map();
        let nextUrut = siswaList.length + 1;

        if (state.importMode === 'bulanan') {
          const bObj = BULAN_TP[state.importMonthIdx] || BULAN_TP[0];
          const year = Number(tp.tahun_mulai) + bObj.offsetYear;
          const daysInMonth = new Date(year, bObj.month, 0).getDate();
          const ymPrefix = `${year}-${String(bObj.month).padStart(2, '0')}`;

          // Cari baris header tanggal (1, 2, 3...)
          let headerRowIdx = -1;
          let dayColMap = {}; // dayNumber -> colIdx
          let nameColIdx = 1;

          for (let r = 0; r < Math.min(rows.length, 15); r++) {
            const row = rows[r];
            let foundDays = 0;
            const tempMap = {};
            row.forEach((cell, cIdx) => {
              const n = Number(String(cell).trim());
              if (Number.isInteger(n) && n >= 1 && n <= 31 && tempMap[n] === undefined) {
                tempMap[n] = cIdx;
                foundDays++;
              }
              if (/^nama/i.test(String(cell).trim())) nameColIdx = cIdx;
            });
            if (foundDays >= 7) {
              headerRowIdx = r;
              dayColMap = tempMap;
              break;
            }
          }

          if (headerRowIdx < 0) {
            showToast('Format kolom tanggal 1–31 tidak ditemukan. Gunakan Template 1–31.', true);
            return;
          }

          for (let r = headerRowIdx + 1; r < rows.length; r++) {
            const row = rows[r];
            const rawName = String(row[nameColIdx] || '').trim();
            if (!rawName || rawName.length < 2) continue;
            if (/^(total|jumlah|rekap|bulan|no\b|nama\b|petunjuk)/i.test(rawName)) continue;

            const upper = rawName.toUpperCase();
            const existing = existingMap.get(upper);
            if (!existing && !autoAdd) continue;

            if (!existing && !newStudentMap.has(upper)) {
              const noVal = Number(row[0]);
              newStudentMap.set(upper, {
                kelas_id: state.activeKelasId,
                no_urut: Number.isInteger(noVal) && noVal > 0 ? noVal : nextUrut++,
                nama_lengkap: upper,
                aktif: true
              });
            }

            for (let d = 1; d <= daysInMonth; d++) {
              const cIdx = dayColMap[d];
              if (cIdx === undefined) continue;
              const val = parseNominalCell(row[cIdx]);
              if (val === 0) continue;
              entries.push({
                nama_lengkap: upper,
                siswa_id: existing ? existing.id : null,
                isNewStudent: !existing,
                tanggal: `${ymPrefix}-${String(d).padStart(2, '0')}`,
                jenis: val < 0 ? 'tarik' : 'setor',
                nominal: Math.abs(val),
                keterangan: `Impor Excel (${bObj.name} ${year})`
              });
            }
          }
        } else {
          // Format Rekap Per Bulan (Juli - Juni)
          let headerRowIdx = -1;
          let monthColMap = {}; // monthIdx (0..11) -> colIdx
          let nameColIdx = 1;

          for (let r = 0; r < Math.min(rows.length, 15); r++) {
            const row = rows[r];
            let foundMonths = 0;
            const tempMap = {};
            row.forEach((cell, cIdx) => {
              const txt = String(cell).trim().toLowerCase();
              if (/^nama/i.test(txt)) nameColIdx = cIdx;
              BULAN_TP.forEach(b => {
                if (txt === b.name.toLowerCase() || txt === b.short.toLowerCase() || txt.startsWith(b.name.toLowerCase())) {
                  if (tempMap[b.idx] === undefined) {
                    tempMap[b.idx] = cIdx;
                    foundMonths++;
                  }
                }
              });
            });
            if (foundMonths >= 3) {
              headerRowIdx = r;
              monthColMap = tempMap;
              break;
            }
          }

          if (headerRowIdx < 0) {
            showToast('Kolom nama bulan (Juli–Juni) tidak ditemukan. Gunakan Template Rekap Jul–Jun.', true);
            return;
          }

          for (let r = headerRowIdx + 1; r < rows.length; r++) {
            const row = rows[r];
            const rawName = String(row[nameColIdx] || '').trim();
            if (!rawName || rawName.length < 2) continue;
            if (/^(total|jumlah|rekap|bulan|no\b|nama\b|petunjuk)/i.test(rawName)) continue;

            const upper = rawName.toUpperCase();
            const existing = existingMap.get(upper);
            if (!existing && !autoAdd) continue;

            if (!existing && !newStudentMap.has(upper)) {
              const noVal = Number(row[0]);
              newStudentMap.set(upper, {
                kelas_id: state.activeKelasId,
                no_urut: Number.isInteger(noVal) && noVal > 0 ? noVal : nextUrut++,
                nama_lengkap: upper,
                aktif: true
              });
            }

            BULAN_TP.forEach(b => {
              const cIdx = monthColMap[b.idx];
              if (cIdx === undefined) return;
              const val = parseNominalCell(row[cIdx]);
              if (val === 0) return;
              const year = Number(tp.tahun_mulai) + b.offsetYear;
              const tanggal = `${year}-${String(b.month).padStart(2, '0')}-01`;
              entries.push({
                nama_lengkap: upper,
                siswa_id: existing ? existing.id : null,
                isNewStudent: !existing,
                tanggal,
                jenis: val < 0 ? 'tarik' : 'setor',
                nominal: Math.abs(val),
                keterangan: `Impor Rekap ${b.name} ${year}`
              });
            });
          }
        }

        if (!entries.length) {
          showToast('Tidak ada nominal tabungan yang terbaca di file Excel tersebut.', true);
          return;
        }

        const totalNominal = entries.reduce((acc, it) => acc + (it.jenis === 'tarik' ? -it.nominal : it.nominal), 0);
        state.importDraft = {
          fileName: file.name,
          newStudents: Array.from(newStudentMap.values()),
          entries,
          totalNominal
        };
        renderKelola(container);
      } catch (err) {
        console.error(err);
        showToast('Gagal membaca file Excel: ' + err.message, true);
      }
    }

    async function commitImportTabungan(container) {
      const draft = state.importDraft;
      if (!draft || !draft.entries.length) return;
      const btn = document.getElementById('btn-commit-imp-tx');
      if (btn) { btn.disabled = true; btn.textContent = 'Mengimpor...'; }

      try {
        const nameToId = new Map(getSiswaAktifKelas().map(s => [s.nama_lengkap.trim().toUpperCase(), s.id]));

        if (draft.newStudents.length) {
          const insertedSiswa = await dbInsert('siswa', draft.newStudents);
          (insertedSiswa || []).forEach(s => {
            nameToId.set(s.nama_lengkap.trim().toUpperCase(), s.id);
          });
        }

        const txRows = [];
        draft.entries.forEach(it => {
          const sid = it.siswa_id || nameToId.get(it.nama_lengkap);
          if (!sid) return;
          txRows.push({
            siswa_id: sid,
            kelas_id: state.activeKelasId,
            tanggal: it.tanggal,
            jenis: it.jenis,
            nominal: it.nominal,
            keterangan: it.keterangan
          });
        });

        if (!txRows.length) throw new Error('Tidak ada transaksi valid yang bisa disimpan.');

        await dbInsert('transaksi_tabungan', txRows);
        state.importDraft = null;
        showToast(`Berhasil mengimpor ${txRows.length} transaksi tabungan!`);
        await loadAllData();
      } catch (err) {
        console.error(err);
        showToast('Gagal menyimpan impor: ' + (err.message || err), true);
        if (btn) { btn.disabled = false; btn.textContent = '✅ Simpan & Impor Sekarang'; }
      }
    }

    async function handleImportExcelSiswa(e) {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file || typeof XLSX === 'undefined') return;
      try {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
        const existingNames = new Set(getSiswaAktifKelas().map(s => s.nama_lengkap.toUpperCase()));
        const toInsert = [];
        let urut = getSiswaAktifKelas().length + 1;

        for (const r of rows) {
          const maybeNo = Number(r[0]);
          const maybeName = String(r[1] || r[0] || '').trim();
          if (!maybeName || maybeName.length < 3) continue;
          if (/^(no|nama|rekap|bulan|catatan|kelas|jumlah)/i.test(maybeName)) continue;
          const upper = maybeName.toUpperCase();
          if (existingNames.has(upper)) continue;
          existingNames.add(upper);
          toInsert.push({
            kelas_id: state.activeKelasId,
            no_urut: !isNaN(maybeNo) && maybeNo > 0 ? maybeNo : urut++,
            nama_lengkap: upper,
            aktif: true
          });
        }
        if (!toInsert.length) {
          showToast('Tidak ditemukan nama siswa baru di file Excel tersebut', true);
          return;
        }
        await dbInsert('siswa', toInsert);
        showToast(`${toInsert.length} siswa berhasil diimpor dari Excel!`);
        await loadAllData();
      } catch (err) {
        showToast('Gagal membaca file Excel: ' + err.message, true);
      }
    }

    function exportBulananExcel(kls, tp, bObj, year, daysInMonth, siswaList, cellMap) {
      if (typeof XLSX === 'undefined') { showToast('Library Excel belum siap', true); return; }
      const header = ['NO', 'NAMA SISWA', ...Array.from({ length: daysInMonth }, (_, i) => i + 1), 'JUMLAH'];
      const data = [
        [`REKAP TABUNGAN ${kls.nama_kelas} - TP ${tp.nama}`],
        [`BULAN ${bObj.name.toUpperCase()} ${year}`],
        [],
        header
      ];
      siswaList.forEach((s, i) => {
        let sum = 0;
        const row = [s.no_urut || i + 1, s.nama_lengkap];
        for (let d = 1; d <= daysInMonth; d++) {
          const val = cellMap[s.id]?.[d]?.sum || 0;
          sum += val;
          row.push(val || '');
        }
        row.push(sum);
        data.push(row);
      });
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(data);
      XLSX.utils.book_append_sheet(wb, ws, `${bObj.short} ${year}`);
      XLSX.writeFile(wb, `Rekap_Tabungan_${kls.nama_kelas}_${bObj.name}_${year}.xlsx`);
    }

    function exportTahunanExcel(kls, tp, siswaList, matrix) {
      if (typeof XLSX === 'undefined') { showToast('Library Excel belum siap', true); return; }
      const header = ['NO', 'NAMA SISWA', ...BULAN_TP.map(b => b.name.toUpperCase()), 'TOTAL TAHUNAN'];
      const data = [
        [`REKAP TABUNGAN TAHUNAN ${kls.nama_kelas} - TP ${tp.nama}`],
        [],
        header
      ];
      siswaList.forEach((s, i) => {
        const vals = matrix[s.id] || Array(12).fill(0);
        const total = vals.reduce((a, b) => a + b, 0);
        data.push([s.no_urut || i + 1, s.nama_lengkap, ...vals, total]);
      });
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(data);
      XLSX.utils.book_append_sheet(wb, ws, `TP ${tp.nama.replace('/', '-')}`);
      XLSX.writeFile(wb, `Rekap_Tahunan_${kls.nama_kelas}_TP_${tp.nama.replace('/', '-')}.xlsx`);
    }

    // =====================================================================
    // AUTHENTICATION FLOW (100% REAL SUPABASE SAAT IS_PREVIEW = false)
    // =====================================================================
    function enterApp(email) {
      state.user = { email };
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-shell').classList.add('active');
      document.getElementById('admin-email-txt').textContent = email;
      document.getElementById('admin-avatar-txt').textContent = (email || 'G')[0].toUpperCase();
      loadAllData();
    }

    async function handleLogout() {
      try {
        if (!IS_PREVIEW) {
          const { error } = await supabase.auth.signOut();
          if (error) throw error;
        }
        state.user = null;
        document.getElementById('app-shell').classList.remove('active');
        document.getElementById('login-screen').style.display = 'flex';
        showToast('Anda telah keluar');
      } catch (err) {
        showToast(err.message || 'Gagal logout', true);
      }
    }

    async function bootstrap() {
      // Aturan ketat IS_PREVIEW: tampilkan elemen preview HANYA jika IS_PREVIEW === true
      if (IS_PREVIEW) {
        document.getElementById('preview-banner').style.display = 'flex';
        document.getElementById('preview-quick-login-wrap').style.display = 'block';
        document.getElementById('btn-preview-login').onclick = () => enterApp('preview.guru@sitabung.local');
      } else {
        document.getElementById('preview-banner')?.remove();
        document.getElementById('preview-quick-login-wrap')?.remove();
      }

      // Responsive tombol logout mobile
      const syncMobileLogout = () => {
        document.getElementById('btn-logout-mobile').style.display = window.innerWidth <= 768 ? 'inline-flex' : 'none';
      };
      syncMobileLogout();
      window.addEventListener('resize', syncMobileLogout);

      // Event listeners global
      document.getElementById('login-form').onsubmit = async (e) => {
        e.preventDefault();
        const errBox = document.getElementById('login-error');
        errBox.style.display = 'none';
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('btn-login-submit');
        btn.disabled = true;
        btn.textContent = 'Memverifikasi...';

        try {
          if (IS_PREVIEW) {
            enterApp(email || 'admin@preview.local');
          } else {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            enterApp(data.user.email);
          }
        } catch (err) {
          errBox.textContent = err.message || 'Email atau password tidak valid.';
          errBox.style.display = 'block';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Masuk ke Aplikasi';
        }
      };

      document.querySelectorAll('#desktop-nav .nav-item, #mobile-nav .m-nav-btn').forEach(btn => {
        btn.onclick = () => setView(btn.dataset.view);
      });
      document.getElementById('global-tp-select').onchange = (e) => {
        state.activeTpId = e.target.value;
        const klsList = getKelasByTp(state.activeTpId);
        state.activeKelasId = klsList[0]?.id || null;
        state.selectedStudentId = null;
        renderSwitchers();
        renderCurrentView();
      };
      document.getElementById('global-kelas-select').onchange = (e) => {
        state.activeKelasId = e.target.value;
        state.selectedStudentId = null;
        renderSwitchers();
        renderCurrentView();
      };
      document.getElementById('btn-quick-satuan').onclick = () => openTxModal();
      document.getElementById('btn-quick-massal').onclick = () => openMassalModal();
      document.getElementById('btn-logout-desktop').onclick = handleLogout;
      document.getElementById('btn-logout-mobile').onclick = handleLogout;
      document.getElementById('btn-install-sidebar').onclick = triggerInstallPWA;
      document.getElementById('modal-close-btn').onclick = closeModal;
      document.getElementById('app-modal').onclick = (e) => {
        if (e.target.id === 'app-modal') closeModal();
      };

      // Cek sesi aktif Supabase saat produksi
      if (!IS_PREVIEW) {
        try {
          const { data } = await supabase.auth.getSession();
          if (data?.session?.user) {
            enterApp(data.session.user.email);
          }
        } catch (err) {
          console.error('Session check error:', err);
        }
      }
    }

    bootstrap();
  </script>
